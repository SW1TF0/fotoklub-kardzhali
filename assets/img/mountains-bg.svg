<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f2e" />
      <stop offset="35%" stop-color="#2a1a4a" />
      <stop offset="62%" stop-color="#7a3a5e" />
      <stop offset="80%" stop-color="#d97a4a" />
      <stop offset="100%" stop-color="#f2a65a" />
    </linearGradient>

    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#f2a65a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f2a65a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2560" />
      <stop offset="100%" stop-color="#1a1640" />
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2560" />
      <stop offset="100%" stop-color="#231a44" />
    </linearGradient>
    <linearGradient id="ridge3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2a52" />
      <stop offset="100%" stop-color="#2c1a38" />
    </linearGradient>
    <linearGradient id="ridge4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b3346" />
      <stop offset="100%" stop-color="#33202e" />
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1" />
      <stop offset="18%" stop-color="#0a0a0a" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#0a0a0a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)" />

  <circle cx="1450" cy="430" r="260" fill="url(#sun)" />
  <circle cx="1450" cy="430" r="70" fill="#ffe6bd" opacity="0.9" />

  <!-- stars, upper sky only -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6" opacity="0.8" />
    <circle cx="260" cy="160" r="1.2" opacity="0.6" />
    <circle cx="420" cy="70" r="1.8" opacity="0.7" />
    <circle cx="610" cy="140" r="1.3" opacity="0.5" />
    <circle cx="800" cy="60" r="1.6" opacity="0.8" />
    <circle cx="980" cy="120" r="1.2" opacity="0.6" />
    <circle cx="1180" cy="80" r="1.5" opacity="0.7" />
    <circle cx="1700" cy="100" r="1.4" opacity="0.6" />
    <circle cx="1820" cy="180" r="1.7" opacity="0.7" />
    <circle cx="60" cy="240" r="1.2" opacity="0.5" />
    <circle cx="1550" cy="60" r="1.3" opacity="0.6" />
  </g>

  <!-- far ridge -->
  <path d="M0,620 L120,560 260,600 400,520 560,590 720,540 900,610 1080,540 1260,600 1440,530 1620,600 1800,550 1920,610 1920,1080 0,1080 Z" fill="url(#ridge1)" />

  <!-- mid-far ridge -->
  <path d="M0,700 L160,630 340,690 520,610 720,680 920,600 1120,670 1320,610 1520,680 1720,620 1920,690 1920,1080 0,1080 Z" fill="url(#ridge2)" />

  <!-- mid ridge -->
  <path d="M0,800 L200,720 420,790 640,710 880,800 1100,720 1340,800 1560,730 1780,800 1920,760 1920,1080 0,1080 Z" fill="url(#ridge3)" />

  <!-- near ridge -->
  <path d="M0,920 L240,840 480,910 720,830 980,920 1220,840 1480,920 1700,850 1920,910 1920,1080 0,1080 Z" fill="url(#ridge4)" />

  <rect width="1920" height="1080" fill="url(#fade)" />
</svg>
